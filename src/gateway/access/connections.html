<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Connections · Workspace</title>
  <link rel="stylesheet" href="/access/page.css?v=5">
  <script src="/connections/page.js?v=6" defer></script>
</head>
<body>
  <main class="shell">
    <header class="brand"><span class="brand-mark" aria-hidden="true">W</span> Workspace <span class="brand-detail">Connections</span></header>
    <section class="conn-head">
      <span class="eyebrow">YOUR CONNECTIONS</span>
      <h1>Connect your accounts.</h1>
      <p>See which services are available and which ones you have connected. <a href="/access">Manage client permissions →</a></p>
    </section>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <div id="cards" class="cards" aria-busy="true"><p class="loading">Loading connections…</p></div>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>Workspace MCP Gateway <span>Credentials stay encrypted on the gateway.</span></footer>
  </main>
</body>
</html>
