<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex billing</title>
<style>
{{SHARED_CSS}}
.tabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.tab { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
ul.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--border); background: none; text-align: start; cursor: pointer; min-height: 52px; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row .main { flex: 1; min-width: 0; }
.row .name { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { display: block; color: var(--muted); font-size: 12px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: var(--surface-2); color: var(--muted); }
.badge.ts { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.form { padding: 12px 14px; display: grid; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label.lbl { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
textarea.field { min-height: 64px; padding: 8px 12px; resize: vertical; }
.entry { display: grid; grid-template-columns: 130px 1fr 80px 40px; gap: 6px; align-items: center; }
.entry.item { grid-template-columns: 1fr 70px 90px 40px; }
@media (max-width: 480px) { .entry, .entry.item { grid-template-columns: 1fr 1fr; } .entry .field.desc { grid-column: 1 / -1; order: 3; } }
.total { display: flex; justify-content: space-between; padding: 6px 2px; font-weight: 600; }
.actions { display: flex; gap: 8px; justify-content: flex-end; padding: 0 14px 12px; }
.note { margin: 10px 14px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
select.field { padding-inline: 8px; }
.chipbar { display: flex; gap: 8px; align-items: center; }
.busy { opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<div class="card" id="root"><div class="skeleton"></div><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:55%"></div></div>
<script>
{{SHARED_JS}}
</script>
<script>
(function () {
  'use strict';
  var STRINGS = {
    en: { title: 'Apex billing', clients: 'Clients', timesheets: 'Timesheets', none: 'Nothing here yet.', direct: 'Direct', timesheet: 'Timesheet',
      perHour: '/h', hst: 'HST', back: 'Back', newTs: 'New timesheet', newInv: 'New invoice', lastTs: 'Last period ends', hours: 'h',
      period: 'Period', start: 'Start', end: 'End', notes: 'Notes', entries: 'Entries', addEntry: 'Add entry', addItem: 'Add line',
      date: 'Date', desc: 'What was worked on', descItem: 'Description', qty: 'Qty', rate: 'Rate', hrs: 'Hours', remove: 'Remove', total: 'Total',
      issue: 'Issue date', due: 'Due date (optional)', save: 'Save changes', file: 'File timesheet', createInv: 'Create invoice', saved: 'Saved.',
      filed: 'Timesheet filed; a draft invoice was created.', invoiced: 'Invoice created.', failed: 'That did not work: ', cancel: 'Cancel',
      confirm: 'Confirm', needDates: 'Enter valid start and end dates (YYYY-MM-DD).', needEntries: 'Add at least one entry with a date and hours.',
      needItems: 'Add at least one line with a description.', needIssue: 'Enter the issue date.', workspace: 'Workspace', switchWs: 'Switch workspace…',
      refresh: 'Refresh', unknown: 'Unnamed' },
    fa: { title: 'صورتحساب Apex', clients: 'مشتری‌ها', timesheets: 'برگه‌های ساعت', none: 'هنوز چیزی نیست.', direct: 'مستقیم', timesheet: 'برگه ساعت',
      perHour: '/ساعت', hst: 'مالیات', back: 'بازگشت', newTs: 'برگه ساعت جدید', newInv: 'فاکتور جدید', lastTs: 'پایان دوره قبل', hours: 'ساعت',
      period: 'دوره', start: 'شروع', end: 'پایان', notes: 'توضیحات', entries: 'ردیف‌ها', addEntry: 'افزودن ردیف', addItem: 'افزودن قلم',
      date: 'تاریخ', desc: 'شرح کار', descItem: 'شرح', qty: 'تعداد', rate: 'نرخ', hrs: 'ساعت', remove: 'حذف', total: 'جمع',
      issue: 'تاریخ صدور', due: 'سررسید (اختیاری)', save: 'ذخیره تغییرات', file: 'ثبت برگه ساعت', createInv: 'ایجاد فاکتور', saved: 'ذخیره شد.',
      filed: 'برگه ساعت ثبت و فاکتور پیش‌نویس ساخته شد.', invoiced: 'فاکتور ساخته شد.', failed: 'انجام نشد: ', cancel: 'انصراف',
      confirm: 'تأیید', needDates: 'تاریخ شروع و پایان معتبر وارد کنید (YYYY-MM-DD).', needEntries: 'حداقل یک ردیف با تاریخ و ساعت اضافه کنید.',
      needItems: 'حداقل یک قلم با شرح اضافه کنید.', needIssue: 'تاریخ صدور را وارد کنید.', workspace: 'فضای کار', switchWs: 'تغییر فضای کار…',
      refresh: 'تازه‌سازی', unknown: 'بدون نام' }
  };
  var lang = 'en';
  function t(key) { return (STRINGS[lang] || STRINGS.en)[key] || STRINGS.en[key] || key; }

  var state = { tab: 'clients', clients: null, timesheets: null, workspaces: [], workspaceId: '', workspaceName: '', view: null, loaded: false, error: '', notice: '', busy: false, filterClient: null };
  var root = document.getElementById('root');
  var app;

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === false || v == null) return;
      if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    [].concat(kids || []).forEach(function (kid) {
      if (kid == null || kid === false) return;
      el.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    });
    return el;
  }
  var REFRESH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>';
  var CLOSE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function icon(svg) { var s = document.createElement('span'); s.style.display = 'contents'; s.innerHTML = svg; return s; } // static literals only

  // ---- tolerant parsing: Apex responses are passthrough JSON of unknown wrapping ----
  function parseLoose(text) {
    try { return JSON.parse(text); } catch (e) { /* maybe several concatenated JSON values */ }
    var out = [], depth = 0, start = -1, inStr = false, esc = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true;
      else if (c === '{' || c === '[') { if (depth === 0) start = i; depth++; }
      else if (c === '}' || c === ']') { depth--; if (depth === 0 && start >= 0) { try { out.push(JSON.parse(text.slice(start, i + 1))); } catch (e2) { /* skip */ } start = -1; } }
    }
    return out.length === 1 ? out[0] : out;
  }
  function unwrap(data) {
    if (data && typeof data.text === 'string' && Object.keys(data).length === 1) return parseLoose(data.text);
    return data;
  }
  function listOf(data, keys) {
    data = unwrap(data);
    if (Array.isArray(data)) return data;
    if (!data || typeof data !== 'object') return [];
    var all = ['result', 'data', 'items'].concat(keys || []);
    for (var i = 0; i < all.length; i++) if (Array.isArray(data[all[i]])) return data[all[i]];
    var k = Object.keys(data).filter(function (key) { return Array.isArray(data[key]); });
    return k.length ? data[k[0]] : [];
  }
  function num(v) { var n = typeof v === 'string' ? parseFloat(v) : v; return typeof n === 'number' && isFinite(n) ? n : 0; }
  function str(v) { return v == null ? '' : String(v); }
  function dateOnly(v) { return str(v).slice(0, 10); }

  function normClient(c) {
    c = c || {};
    return { id: str(c.id), name: str(c.name || c.companyName || c.clientName || c.displayName || c.company) || t('unknown'),
      mode: str(c.billingMode || c.billing_mode).toUpperCase() === 'TIMESHEET' ? 'TIMESHEET' : 'DIRECT',
      rate: c.hourlyRate != null ? num(c.hourlyRate) : (c.rate != null ? num(c.rate) : null),
      hst: c.chargeHst != null ? num(c.chargeHst) : (c.charge_hst != null ? num(c.charge_hst) : null) };
  }
  function normEntry(e) { e = e || {}; return { date: dateOnly(e.workDate || e.work_date || e.date), description: str(e.description), hours: num(e.hours) }; }
  function normTs(ts) {
    ts = ts || {};
    var entries = (Array.isArray(ts.entries) ? ts.entries : []).map(normEntry);
    var client = ts.client && typeof ts.client === 'object' ? ts.client : {};
    var hours = entries.reduce(function (s, e) { return s + e.hours; }, 0);
    return { id: str(ts.id), clientId: str(ts.clientId || ts.client_id || client.id),
      clientName: str(client.name || ts.clientName || ts.client_name) || '', start: dateOnly(ts.periodStart || ts.period_start), end: dateOnly(ts.periodEnd || ts.period_end),
      notes: str(ts.notes), entries: entries, hours: ts.totalHours != null ? num(ts.totalHours) : hours };
  }
  function looksLikeTimesheet(d) { return d && typeof d === 'object' && !Array.isArray(d) && (d.periodStart || d.period_start || Array.isArray(d.entries)); }
  function clientById(id) { return (state.clients || []).filter(function (c) { return c.id === id; })[0] || null; }

  // ---- formatting ----
  function fmtDate(s) {
    if (!/^\d{4}-\d{2}-\d{2}/.test(s || '')) return s || '—';
    try { return new Intl.DateTimeFormat(document.documentElement.lang || 'en', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' }).format(new Date(s.slice(0, 10) + 'T00:00:00Z')); }
    catch (e) { return s.slice(0, 10); }
  }
  function fmtNum(n, max) {
    try { return new Intl.NumberFormat(document.documentElement.lang || 'en', { maximumFractionDigits: max == null ? 2 : max }).format(n); } catch (e) { return String(n); }
  }
  function fmtMoney(n) {
    try { return new Intl.NumberFormat(document.documentElement.lang || 'en', { style: 'currency', currency: 'CAD' }).format(n); } catch (e) { return fmtNum(n); }
  }
  function addDay(s, days) {
    var d = new Date(s + 'T00:00:00Z');
    if (isNaN(d)) return '';
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  // ---- data ----
  // Every workspace-scoped tool takes the selected workspace; Apex re-checks it per call.
  function wcall(name, args, options) {
    return app.callTool(name, Object.assign({}, args || {}, { workspace_id: state.workspaceId }), options);
  }
  function syncWorkspace() {
    var w = state.workspaces.filter(function (x) { return x.id === state.workspaceId; })[0];
    state.workspaceName = w ? str(w.name) : '';
  }
  function pickDefaultWorkspace() {
    if (state.workspaceId || !state.workspaces.length) return false;
    var biz = state.workspaces.filter(function (w) { return w.kind === 'BUSINESS'; });
    state.workspaceId = (biz[0] || state.workspaces[0]).id; syncWorkspace();
    return true;
  }
  function fail(e) { state.busy = false; state.loaded = true; if (!e || e.cancelled) return render(); state.error = t('failed') + e.message; render(); }
  function loadClients() {
    return wcall('apex_list_clients', {}).then(function (data) {
      state.clients = listOf(data, ['clients']).map(normClient);
    });
  }
  function loadTimesheets(clientId) {
    var args = clientId ? { client_id: clientId } : {};
    return wcall('apex_list_timesheets', args).then(function (data) {
      state.timesheets = listOf(data, ['timesheets']).map(normTs);
      state.filterClient = clientId || null;
    });
  }
  function loadWorkspaces() {
    return app.callTool('apex_list_workspaces', {}).then(function (data) {
      state.workspaces = listOf(data, ['workspaces']).filter(function (w) { return w && w.id; });
      syncWorkspace();
    }).catch(function () { state.workspaces = []; });
  }
  function ensure(tab) {
    var jobs = [];
    if (tab === 'clients' && !state.clients) jobs.push(loadClients());
    if (tab === 'timesheets') {
      if (!state.clients) jobs.push(loadClients());
      if (!state.timesheets) jobs.push(loadTimesheets(null));
    }
    return Promise.all(jobs);
  }
  function go(tab) {
    state.tab = tab; state.view = null; state.error = ''; state.notice = '';
    if (tab === 'timesheets' && state.filterClient) state.timesheets = null;
    state.filterClient = null;
    ensure(tab).then(render).catch(fail);
    render();
  }
  function reload() {
    state.clients = null; state.timesheets = null; state.view = null; state.error = '';
    ensure(state.tab).then(function () { state.loaded = true; render(); }).catch(fail);
  }
  function switchWorkspace(id) {
    state.workspaceId = id; syncWorkspace(); reload();
  }

  // ---- views ----
  function openClient(c) {
    state.error = ''; state.notice = '';
    state.busy = true; render();
    var last = c.mode === 'TIMESHEET'
      ? wcall('apex_get_last_timesheet', { client_id: c.id }).then(function (d) { var x = unwrap(d); return x && looksLikeTimesheet(x) ? normTs(x) : null; }).catch(function () { return null; })
      : Promise.resolve(null);
    last.then(function (prev) {
      state.busy = false;
      var start = prev && prev.end ? addDay(prev.end, 1) : '';
      state.view = { kind: 'new', client: c, lastEnd: prev && prev.end || '', start: start, end: '', issue: today(), due: '', notes: '',
        entries: [{ date: start, description: '', hours: 0 }], items: [{ description: '', quantity: 1, rate: c.rate || 0 }] };
      render();
    });
  }
  function openTimesheet(ts) { state.error = ''; state.notice = ''; state.view = { kind: 'edit', ts: ts, start: ts.start, end: ts.end, notes: ts.notes, entries: ts.entries.map(function (e) { return Object.assign({}, e); }) }; render(); }

  function validEntries(entries) {
    var rows = entries.filter(function (e) { return e.date || e.description || e.hours; });
    var ok = rows.length && rows.every(function (e) { return DATE_RE.test(e.date) && e.hours >= 0 && e.description.trim(); });
    return ok ? rows.map(function (e) { return { work_date: e.date, description: e.description.trim(), hours: e.hours }; }) : null;
  }

  function submit() {
    var v = state.view; state.error = '';
    var tool, args, success, after;
    if (v.kind === 'edit') {
      var entries = validEntries(v.entries);
      if (!DATE_RE.test(v.start) || !DATE_RE.test(v.end)) return setProblem(t('needDates'));
      if (!entries) return setProblem(t('needEntries'));
      tool = 'apex_update_timesheet';
      args = { timesheet_id: v.ts.id, period_start: v.start, period_end: v.end, notes: v.notes, entries: entries };
      success = t('saved');
      after = function () { v.ts.start = v.start; v.ts.end = v.end; v.ts.notes = v.notes; v.ts.entries = v.entries.map(function (e) { return Object.assign({}, e); }); v.ts.hours = v.entries.reduce(function (s, e) { return s + e.hours; }, 0); };
    } else if (v.client.mode === 'TIMESHEET') {
      var rows = validEntries(v.entries);
      if (!DATE_RE.test(v.start) || !DATE_RE.test(v.end)) return setProblem(t('needDates'));
      if (!rows) return setProblem(t('needEntries'));
      if (!DATE_RE.test(v.issue)) return setProblem(t('needIssue'));
      tool = 'apex_create_timesheet';
      args = { client_id: v.client.id, issue_date: v.issue, period_start: v.start, period_end: v.end, entries: rows };
      if (v.notes) args.notes = v.notes;
      if (DATE_RE.test(v.due)) args.due_date = v.due;
      success = t('filed');
      after = function () { state.timesheets = null; };
    } else {
      var items = v.items.filter(function (i) { return i.description.trim(); });
      if (!items.length) return setProblem(t('needItems'));
      if (!DATE_RE.test(v.issue)) return setProblem(t('needIssue'));
      tool = 'apex_create_invoice';
      args = { client_id: v.client.id, issue_date: v.issue, line_items: items.map(function (i) { return { description: i.description.trim(), quantity: i.quantity, rate: i.rate }; }) };
      if (v.notes) args.notes = v.notes;
      if (DATE_RE.test(v.due)) args.due_date = v.due;
      success = t('invoiced');
      after = function () {};
    }
    state.busy = true; render();
    wcall(tool, args, { confirm: function (preview) { state.busy = false; render(); return app.confirm(preview, { ok: t('confirm'), cancel: t('cancel') }).then(function (ok) { if (ok) { state.busy = true; render(); } return ok; }); } })
      .then(function () { after(); state.busy = false; state.view = null; state.notice = success; render(); })
      .catch(function (e) { state.busy = false; if (e && e.cancelled) return render(); state.error = t('failed') + e.message; render(); });
  }
  function setProblem(message) { state.error = message; render(); }

  // ---- rendering ----
  function field(type, value, onInput, extra) {
    var input = h('input', Object.assign({ class: 'field', type: type, value: value }, extra || {}));
    input.addEventListener('input', function () { onInput(input.value); });
    return input;
  }
  function labelled(text, control) { return h('label', { class: 'lbl' }, [text, control]); }

  function clientRow(c) {
    var sub = [c.mode === 'TIMESHEET' ? t('timesheet') : t('direct')];
    if (c.rate) sub.push(fmtMoney(c.rate) + t('perHour'));
    if (c.hst != null) sub.push(t('hst') + ' ' + fmtNum(c.hst) + '%');
    return h('li', {}, h('button', { class: 'row', type: 'button', onclick: function () { openClient(c); } }, [
      h('span', { class: 'main' }, [h('span', { class: 'name' }, c.name), h('span', { class: 'sub' }, sub.join(' · '))]),
      h('span', { class: 'badge' + (c.mode === 'TIMESHEET' ? ' ts' : '') }, c.mode === 'TIMESHEET' ? t('timesheet') : t('direct'))]));
  }
  function tsRow(ts) {
    var c = clientById(ts.clientId);
    var name = ts.clientName || (c && c.name) || '';
    return h('li', {}, h('button', { class: 'row', type: 'button', onclick: function () { openTimesheet(ts); } }, [
      h('span', { class: 'main' }, [h('span', { class: 'name' }, fmtDate(ts.start) + ' – ' + fmtDate(ts.end)), h('span', { class: 'sub' }, name)]),
      h('span', { class: 'num muted' }, fmtNum(ts.hours) + ' ' + t('hours'))]));
  }

  function entryRows(v) {
    var wrap = h('div', { class: 'form', style: 'padding:0' });
    v.entries.forEach(function (e, i) {
      wrap.appendChild(h('div', { class: 'entry' }, [
        field('date', e.date, function (x) { e.date = x; }, { 'aria-label': t('date') }),
        field('text', e.description, function (x) { e.description = x; }, { class: 'field desc', placeholder: t('desc'), 'aria-label': t('desc'), maxlength: '500' }),
        field('number', e.hours || '', function (x) { e.hours = num(x); updateTotal(); }, { min: '0', step: '0.25', 'aria-label': t('hrs'), placeholder: t('hrs') }),
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': t('remove'), title: t('remove'), onclick: function () { v.entries.splice(i, 1); if (!v.entries.length) v.entries.push({ date: '', description: '', hours: 0 }); render(); } }, icon(CLOSE))
      ]));
    });
    return wrap;
  }
  function itemRows(v) {
    var wrap = h('div', { class: 'form', style: 'padding:0' });
    v.items.forEach(function (it, i) {
      wrap.appendChild(h('div', { class: 'entry item' }, [
        field('text', it.description, function (x) { it.description = x; }, { class: 'field desc', placeholder: t('descItem'), 'aria-label': t('descItem'), maxlength: '500' }),
        field('number', it.quantity, function (x) { it.quantity = num(x); updateTotal(); }, { min: '0', step: '0.25', 'aria-label': t('qty') }),
        field('number', it.rate, function (x) { it.rate = num(x); updateTotal(); }, { min: '0', step: '0.01', 'aria-label': t('rate') }),
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': t('remove'), title: t('remove'), onclick: function () { v.items.splice(i, 1); if (!v.items.length) v.items.push({ description: '', quantity: 1, rate: 0 }); render(); } }, icon(CLOSE))
      ]));
    });
    return wrap;
  }
  var totalEl = null;
  function updateTotal() {
    var v = state.view; if (!v || !totalEl) return;
    var direct = v.kind === 'new' && v.client.mode !== 'TIMESHEET';
    totalEl.textContent = direct
      ? fmtMoney(v.items.reduce(function (s, i) { return s + i.quantity * i.rate; }, 0))
      : fmtNum(v.entries.reduce(function (s, e) { return s + e.hours; }, 0)) + ' ' + t('hours');
  }

  function formView() {
    var v = state.view;
    var isEdit = v.kind === 'edit';
    var direct = !isEdit && v.client.mode !== 'TIMESHEET';
    var title = isEdit ? fmtDate(v.ts.start) + ' – ' + fmtDate(v.ts.end) : v.client.name + ' · ' + (direct ? t('newInv') : t('newTs'));
    var kids = [];
    if (!isEdit && !direct && v.lastEnd) kids.push(h('div', { class: 'muted' }, t('lastTs') + ': ' + fmtDate(v.lastEnd)));
    if (!direct) {
      kids.push(h('div', { class: 'grid2' }, [
        labelled(t('start'), field('date', v.start, function (x) { v.start = x; })),
        labelled(t('end'), field('date', v.end, function (x) { v.end = x; }))]));
    }
    if (!isEdit) {
      kids.push(h('div', { class: 'grid2' }, [
        labelled(t('issue'), field('date', v.issue, function (x) { v.issue = x; })),
        labelled(t('due'), field('date', v.due, function (x) { v.due = x; }))]));
    }
    kids.push(h('div', { class: 'lbl' }, direct ? t('addItem') : t('entries')));
    kids.push(direct ? itemRows(v) : entryRows(v));
    kids.push(h('button', { class: 'btn', type: 'button', onclick: function () {
      if (direct) v.items.push({ description: '', quantity: 1, rate: v.client.rate || 0 });
      else v.entries.push({ date: '', description: '', hours: 0 });
      render(); } }, direct ? t('addItem') : t('addEntry')));
    totalEl = h('span', { class: 'num' }, '');
    kids.push(h('div', { class: 'total' }, [h('span', {}, t('total')), totalEl]));
    var notes = h('textarea', { class: 'field', 'aria-label': t('notes'), maxlength: '2000' }); notes.value = v.notes || '';
    notes.addEventListener('input', function () { v.notes = notes.value; });
    kids.push(labelled(t('notes'), notes));
    var submitLabel = isEdit ? t('save') : (direct ? t('createInv') : t('file'));
    return [
      h('div', { class: 'card-head' }, [
        h('button', { class: 'btn btn-ghost', type: 'button', onclick: function () { state.view = null; state.error = ''; render(); } }, t('back')),
        h('h1', {}, title)]),
      state.error ? h('div', { class: 'error', role: 'alert' }, state.error) : null,
      h('div', { class: 'form' }, kids),
      h('div', { class: 'actions' }, [h('button', { class: 'btn btn-primary', type: 'button', onclick: submit }, submitLabel)])
    ];
  }

  function listView() {
    var items = state.tab === 'clients' ? (state.clients || []) : (state.timesheets || []);
    var rows = items.map(state.tab === 'clients' ? clientRow : tsRow);
    var picker = null;
    if (state.workspaces.length > 1) {
      var select = h('select', { class: 'field', 'aria-label': t('workspace'), style: 'width:auto;max-width:160px' },
        [h('option', { value: '' }, state.workspaceName || t('switchWs'))].concat(state.workspaces.map(function (w) { return h('option', { value: w.id }, str(w.name) || w.id); })));
      select.addEventListener('change', function () { if (select.value) switchWorkspace(select.value); });
      picker = select;
    } else if (state.workspaceName) picker = h('span', { class: 'badge' }, state.workspaceName);
    return [
      h('div', { class: 'card-head' }, [h('h1', {}, t('title')), h('div', { class: 'chipbar' }, [picker,
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': t('refresh'), title: t('refresh'), onclick: reload }, icon(REFRESH))])]),
      h('div', { class: 'tabs', role: 'tablist' }, ['clients', 'timesheets'].map(function (k) {
        return h('button', { class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(state.tab === k), onclick: function () { go(k); } }, t(k)); })),
      state.notice ? h('div', { class: 'note', role: 'status' }, state.notice) : null,
      state.error ? h('div', { class: 'error', role: 'alert' }, state.error) : null,
      rows.length ? h('ul', { class: 'rows', role: 'list' }, rows) : h('div', { class: 'empty' }, (state.tab === 'clients' ? state.clients : state.timesheets) ? t('none') : '…')
    ];
  }

  function render() {
    if (!state.loaded) return;
    totalEl = null;
    var card = h('div', { class: 'card' + (state.busy ? ' busy' : '') }, state.view ? formView() : listView());
    root.replaceChildren(card);
    updateTotal();
    if (app) app.reportSize();
  }

  function initial(data) {
    var name = app.toolName || '';
    if (app.args && app.args.workspace_id) { state.workspaceId = String(app.args.workspace_id); syncWorkspace(); }
    var d = unwrap(data);
    if (name === 'apex_get_last_timesheet' || (!name && looksLikeTimesheet(d))) {
      state.tab = 'timesheets';
      if (looksLikeTimesheet(d)) { var ts = normTs(d); state.timesheets = [ts]; state.loaded = true; ensureThen(function () { openTimesheet(ts); }); return; }
    }
    if (name === 'apex_list_timesheets') {
      state.tab = 'timesheets';
      state.timesheets = listOf(d, ['timesheets']).map(normTs);
      state.filterClient = (app.args && app.args.client_id) || null;
    } else if (name === 'apex_list_clients' || !name) {
      state.clients = listOf(d, ['clients']).map(normClient);
    }
    state.loaded = true;
    ensureThen(render);
  }
  function ensureThen(fn) { ensure(state.tab).then(function () { state.loaded = true; fn(); }).catch(fail); render(); }

  app = GatewayApp({
    onContext: function (ctx) { lang = /^fa/i.test(ctx.locale || '') ? 'fa' : 'en'; render(); },
    onResult: initial,
    onError: function (error) { state.loaded = true; state.error = t('failed') + error.message; render(); },
    onReady: function () {
      loadWorkspaces().then(function () { if (pickDefaultWorkspace()) reload(); else render(); });
    }
  });
})();
</script>
</body>
</html>
