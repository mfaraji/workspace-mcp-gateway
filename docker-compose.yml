services:
  app:
    build: .
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command:
      ["uv", "run", "--no-sync", "uvicorn", "gateway.app:create_app", "--factory", "--host", "127.0.0.1", "--port", "8001"]
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:-postgresql+psycopg://workspace_mcp:wmcp_local_dev_pw@127.0.0.1:5432/workspace_mcp}}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      TRUSTED_OPEN_WEBUI_ORIGIN: ${TRUSTED_OPEN_WEBUI_ORIGIN:-http://localhost:8000}
      SESSION_SECRET: ${SESSION_SECRET}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_BACKEND_API_KEY: ${CLERK_BACKEND_API_KEY:-}
      CLERK_SESSION_AUDIENCE: ${CLERK_SESSION_AUDIENCE:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_BROWSER_CLIENT_ID: ${CLERK_BROWSER_CLIENT_ID:-}
      CLERK_BROWSER_CLIENT_SECRET: ${CLERK_BROWSER_CLIENT_SECRET:-}
      APEX_BASE_URL: ${APEX_BASE_URL:-http://localhost:3010}
      APEX_MCP_AUDIENCE: ${APEX_MCP_AUDIENCE:-apex-mcp-api}
      # PEM (EC P-256 / RSA>=2048) the gateway signs Apex-only tokens with; empty
      # disables Apex access. Use \n for newlines. Secret.
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:-}
      CAPELLA_CONNECTION_STRING: ${CAPELLA_CONNECTION_STRING:-}
      CAPELLA_USERNAME: ${CAPELLA_USERNAME:-}
      CAPELLA_PASSWORD: ${CAPELLA_PASSWORD:-}
      CAPELLA_BUCKET: ${CAPELLA_BUCKET:-personal}
      CAPELLA_RECIPES_SCOPE: ${CAPELLA_RECIPES_SCOPE:-recipes}
      CAPELLA_RECIPES_COLLECTION: ${CAPELLA_RECIPES_COLLECTION:-recipes}
