services:
  app:
    build: .
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command:
      ["uv", "run", "--no-sync", "uvicorn", "gateway.app:create_app", "--factory", "--host", "127.0.0.1", "--port", "8001"]
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL:-postgresql+psycopg://workspace_mcp:wmcp_local_dev_pw@127.0.0.1:5432/workspace_mcp}}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      TRUSTED_OPEN_WEBUI_ORIGIN: ${TRUSTED_OPEN_WEBUI_ORIGIN:-http://localhost:8000}
      SESSION_SECRET: ${SESSION_SECRET}
      DEV_TRUST_ALL_ORIGINS: ${DEV_TRUST_ALL_ORIGINS:-false}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_LINK_CLIENT_ID: ${CLERK_LINK_CLIENT_ID:-}
      CLERK_LINK_CLIENT_SECRET: ${CLERK_LINK_CLIENT_SECRET:-}
      CLERK_LINK_SCOPE: ${CLERK_LINK_SCOPE:-openid profile mcp:tools}
      APEX_BASE_URL: ${APEX_BASE_URL:-http://localhost:3010}
      # Empty disables Clerk act-as; per-user keys (apex_set_api_key) keep working.
      APEX_GATEWAY_API_KEY: ${APEX_GATEWAY_API_KEY:-}
      CAPELLA_CONNECTION_STRING: ${CAPELLA_CONNECTION_STRING:-}
      CAPELLA_USERNAME: ${CAPELLA_USERNAME:-}
      CAPELLA_PASSWORD: ${CAPELLA_PASSWORD:-}
      CAPELLA_BUCKET: ${CAPELLA_BUCKET:-personal}
      CAPELLA_RECIPES_SCOPE: ${CAPELLA_RECIPES_SCOPE:-recipes}
      CAPELLA_RECIPES_COLLECTION: ${CAPELLA_RECIPES_COLLECTION:-recipes}
